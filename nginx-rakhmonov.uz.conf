server {
    listen 80 default_server;
    server_name _;

    location /webhook/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Important for webhooks
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        
        # Allow larger request bodies for webhook updates
        client_max_body_size 2M;
    }

    # Health check endpoint for bot
    location /health {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }

    # YuklaBot Monitoring Dashboard & SSE
    location /admin {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) real-time buffering settings
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location ~ ^/bot[0-9]+:[A-Za-z0-9_-]+(/.*)?$ {
    	proxy_pass http://127.0.0.1:8081;
    	proxy_http_version 1.1;
    
   	 # JUDA KATTA TIMEOUTS (amalda cheksiz)
    	proxy_read_timeout 86400s;      # 24 soat
    	proxy_connect_timeout 86400s;   # 24 soat
    	proxy_send_timeout 86400s;      # 24 soat
    	client_body_timeout 86400s;     # 24 soat
    	send_timeout 86400s;            # 24 soat
    
    	# BUFFERING O'CHIRISH (muhim!)
    	proxy_buffering off;
    	proxy_request_buffering off;
    
    	# KATTA FAYLLAR
    	client_max_body_size 0;  
    	proxy_set_header Upgrade $http_upgrade;
    	proxy_set_header Connection 'upgrade';
    	proxy_set_header Host $host;
    	proxy_set_header X-Real-IP $remote_addr;
    	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	proxy_set_header X-Forwarded-Proto $scheme;
    	proxy_cache_bypass $http_upgrade;
    }
}
