name: CI / Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Deploys run one at a time, never two at once on the server
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build
      - run: yarn test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      # The server is only reachable inside the tailnet: join it for this job
      - name: Connect to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy over SSH
        # Pinned to a commit: this action receives the server's SSH key
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -e
            cd /mnt/storage/projects/yuklabot
            git fetch origin master
            git reset --hard origin/master
            yarn install --frozen-lockfile --production=false
            yarn build
            pm2 reload ecosystem.config.js --update-env
            pm2 save
